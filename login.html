<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>COMBOX2 - Iniciar sesión</title>

    <!-- Fuentes -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Estilos -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">

                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>

                            <div class="col-lg-6">
                                <div class="p-5">

                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">
                                            ¡Bienvenido de nuevo!
                                        </h1>
                                    </div>

                                    <!-- Formulario existente conectado al endpoint -->
                                    <form action="login.php" method="POST" class="user">

                                        <div class="form-group">
                                            <input
                                                type="email"
                                                name="email"
                                                class="form-control form-control-user"
                                                id="exampleInputEmail"
                                                placeholder="Correo electrónico"
                                                required>
                                        </div>

                                        <div class="form-group">
                                            <input
                                                type="password"
                                                name="psw"
                                                class="form-control form-control-user"
                                                id="exampleInputPassword"
                                                placeholder="Contraseña"
                                                required>
                                        </div>

                                        <div class="form-group">
                                            <div class="custom-control custom-checkbox small">
                                                <input
                                                    type="checkbox"
                                                    class="custom-control-input"
                                                    id="customCheck">
                                                <label class="custom-control-label" for="customCheck">
                                                    Recordarme
                                                </label>
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Iniciar sesión
                                        </button>

                                    </form>

                                    <hr>

                                    <div class="text-center">
                                        <a class="small" href="forgot-password.html">
                                            ¿Olvidaste tu contraseña?
                                        </a>
                                    </div>

                                    <div class="text-center">
                                        <a class="small" href="register.html">
                                            ¡Crear una cuenta!
                                        </a>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Ventana flotante para mensajes -->
    <div class="modal fade" id="loginModal" tabindex="-1"
        role="dialog" aria-labelledby="loginModalTitle" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalTitle">
                        Aviso de inicio de sesión
                    </h5>

                    <button type="button" class="close" data-dismiss="modal"
                        aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body" id="loginModalMessage">
                    Verifica tus datos e inténtalo nuevamente.
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary"
                        data-dismiss="modal">
                        Aceptar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const error = parametros.get('error');

        if (error) {
            let mensaje = 'No fue posible iniciar sesión. Inténtalo nuevamente.';

            if (error === 'credenciales') {
                mensaje = 'El correo o la contraseña son incorrectos.';
            } else if (error === 'conexion') {
                mensaje = 'No fue posible conectar con el servicio de inicio de sesión.';
            }

            document.getElementById('loginModalMessage').textContent = mensaje;
            $('#loginModal').modal('show');
        }
    </script>

</body>
</html>
